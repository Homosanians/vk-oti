spark.sql.extensions                 org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.bronze                 org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.bronze.type            rest
spark.sql.catalog.bronze.uri             http://lakekeeper:8181/catalog
spark.sql.catalog.bronze.warehouse       bronze
spark.sql.catalog.bronze.io-impl         org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.bronze.s3.endpoint     http://minio:9000
spark.sql.catalog.bronze.s3.path-style-access true
spark.sql.catalog.bronze.s3.access-key-id minioadmin
spark.sql.catalog.bronze.s3.secret-access-key minioadmin
spark.sql.catalog.bronze.client.region   us-east-1
spark.sql.catalog.silver                 org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.silver.type            rest
spark.sql.catalog.silver.uri             http://lakekeeper:8181/catalog
spark.sql.catalog.silver.warehouse       silver
spark.sql.catalog.silver.io-impl         org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.silver.s3.endpoint     http://minio:9000
spark.sql.catalog.silver.s3.path-style-access true
spark.sql.catalog.silver.s3.access-key-id minioadmin
spark.sql.catalog.silver.s3.secret-access-key minioadmin
spark.sql.catalog.silver.client.region   us-east-1
spark.sql.catalog.gold                 org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.gold.type            rest
spark.sql.catalog.gold.uri             http://lakekeeper:8181/catalog
spark.sql.catalog.gold.warehouse       gold
spark.sql.catalog.gold.io-impl         org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.gold.s3.endpoint     http://minio:9000
spark.sql.catalog.gold.s3.path-style-access true
spark.sql.catalog.gold.s3.access-key-id minioadmin
spark.sql.catalog.gold.s3.secret-access-key minioadmin
spark.sql.catalog.gold.client.region   us-east-1
spark.master                         local[12]
spark.driver.memory                  5g
spark.sql.shuffle.partitions         48
spark.sql.adaptive.enabled           true
spark.ui.showConsoleProgress         false
