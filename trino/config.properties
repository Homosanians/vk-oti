coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
query.max-memory=6GB
query.max-memory-per-node=6GB
memory.heap-headroom-per-node=1500MB
query.max-history=5000
query.min-expire-age=360m
# Spill на диск как страховка для тяжёлых джойнов.
spill-enabled=true
spiller-spill-path=/tmp/trino-spill
max-spill-per-node=40GB
query-max-spill-per-node=40GB
